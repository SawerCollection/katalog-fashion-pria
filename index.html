<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog Fashion Pria</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222
}

header{
background:#111;
color:white;
padding:24px 16px
}

header h1{
margin:0 0 8px;
font-size:26px
}

header p{
margin:0;
color:#ccc
}

.wrap{
max-width:1100px;
margin:auto;
padding:16px
}

.toolbar{
display:flex;
gap:10px;
margin-bottom:14px;
flex-wrap:wrap
}

input,select,button{
border:1px solid #ddd;
border-radius:10px;
padding:12px;
font-size:15px
}

#search{
flex:1;
min-width:200px
}

button{
background:#111;
color:white;
cursor:pointer
}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:10px;
margin-bottom:15px
}

.categories button{
white-space:nowrap;
background:white;
color:#222
}

.categories button.active{
background:#111;
color:white
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.card{
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.06)
}

.card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
background:#eee
}

.info{
padding:12px
}

.num{
font-size:12px;
color:#888;
margin-bottom:5px
}

.name{
font-weight:bold;
font-size:16px;
margin-bottom:6px
}

.category{
font-size:12px;
color:#777;
margin-bottom:6px
}

.price{
font-weight:bold;
font-size:16px;
margin-bottom:10px
}

.buy{
display:block;
text-align:center;
text-decoration:none;
background:#ff5722;
color:white;
padding:10px;
border-radius:8px;
font-weight:bold
}

.empty{
grid-column:1/-1;
text-align:center;
background:white;
padding:40px 15px;
border-radius:14px;
color:#777
}

.admin{
background:white;
margin-top:25px;
padding:16px;
border-radius:14px
}

.admin h2{
margin-top:0
}

.form{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.form input,.form select{
width:100%
}

.form .full{
grid-column:1/-1
}

.admin-actions{
display:flex;
gap:10px;
margin-top:12px;
flex-wrap:wrap
}

.admin-actions button{
flex:1
}

.danger{
background:#d32f2f
}

.edit{
background:#1976d2
}

footer{
text-align:center;
padding:30px;
color:#777;
font-size:13px
}

@media(max-width:600px){
.grid{
grid-template-columns:repeat(2,1fr)
}

.form{
grid-template-columns:1fr
}

.form .full{
grid-column:auto
}

header h1{
font-size:22px
}

.info{
padding:10px
}
}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>🛍️ Katalog Fashion Pria</h1>
<p>Temukan rekomendasi fashion pria pilihan</p>
</div>
</header>

<main class="wrap">

<div class="toolbar">
<input id="search" placeholder="🔎 Cari produk...">

<select id="sort">
<option value="num">Nomor</option>
<option value="name">Nama A-Z</option>
<option value="priceLow">Harga Termurah</option>
<option value="priceHigh">Harga Termahal</option>
</select>
</div>

<div class="categories" id="categories"></div>

<div class="grid" id="grid"></div>

<section class="admin">

<h2>⚙️ Dashboard Admin</h2>

<p style="color:#777">
Tambah produk baru ke katalog. Data tersimpan di browser perangkat ini.
</p>

<div class="form">

<input
id="pnum"
type="number"
min="1"
max="100"
placeholder="Nomor 1-100">

<input
id="pname"
placeholder="Nama produk">

<select id="pcat">
<option value="Kemeja">Kemeja</option>
<option value="Kaos">Kaos</option>
<option value="Celana">Celana</option>
<option value="Topi">Topi</option>
<option value="Sepatu">Sepatu</option>
<option value="Jam Tangan">Jam Tangan</option>
<option value="Aksesori">Aksesori</option>
</select>

<input
id="pprice"
placeholder="Harga, contoh: Rp99.000">

<input
class="full"
id="pimg"
placeholder="URL foto produk">

<input
class="full"
id="plink"
placeholder="Link Shopee Affiliate">

</div>

<div class="admin-actions">

<button onclick="saveProduct()">
💾 Simpan Produk
</button>

<button class="danger" onclick="resetProducts()">
🗑️ Reset Semua Data
</button>

</div>

<p id="status" style="color:#777"></p>

</section>

</main>

<footer>
Katalog Fashion Pria © 2026
</footer>

<script>

const KEY="fashion_pria_catalog_v1";

let products=JSON.parse(
localStorage.getItem(KEY)||"[]"
);

let active="Semua";

const cats=[
"Semua",
"Kemeja",
"Kaos",
"Celana",
"Topi",
"Sepatu",
"Jam Tangan",
"Aksesori"
];

function esc(s){
return String(s||"")
.replace(/[&<>"']/g,function(m){
return({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]);
});
}

function renderCats(){

const box=document.getElementById("categories");

box.innerHTML=cats.map(c=>
`<button class="${active===c?"active":""}"
onclick="setCat('${c}')">${c}</button>`
).join("");

}

function setCat(c){

active=c;

renderCats();
render();

}

function render(){

const q=document
.getElementById("search")
.value
.toLowerCase();

const sort=document
.getElementById("sort")
.value;

let list=products.filter(p=>{

const text=
`${p.name} ${p.cat} ${p.num}`
.toLowerCase();

return(
(active==="Semua"||p.cat===active)
&& text.includes(q)
);

});

if(sort==="num")
list.sort((a,b)=>a.num-b.num);

if(sort==="name")
list.sort((a,b)=>a.name.localeCompare(b.name));

if(sort==="priceLow")
list.sort((a,b)=>
Number(a.price.replace(/\D/g,""))
-
Number(b.price.replace(/\D/g,""))
);

if(sort==="priceHigh")
list.sort((a,b)=>
Number(b.price.replace(/\D/g,""))
-
Number(a.price.replace(/\D/g,""))
);

const grid=document.getElementById("grid");

if(!list.length){

grid.innerHTML=`
<div class="empty">
Belum ada produk.<br><br>
Tambahkan produk melalui Dashboard Admin.
</div>`;

return;

}

grid.innerHTML=list.map(p=>`

<article class="card">

<img
src="${esc(p.img)||"https://placehold.co/600x600?text=Foto+Produk"}"
alt="${esc(p.name)}"
onerror="this.src='https://placehold.co/600x600?text=Foto+Produk'">

<div class="info">

<div class="num">
No. ${esc(p.num)}
</div>

<div class="name">
${esc(p.name)}
</div>

<div class="category">
${esc(p.cat)}
</div>

<div class="price">
${esc(p.price)}
</div>

<a
class="buy"
href="${esc(p.link)}"
target="_blank"
rel="noopener">
🛒 Lihat di Shopee
</a>

</div>

</article>

`).join("");

}

function saveProduct(){

const num=Number(
document.getElementById("pnum").value
);

const name=document
.getElementById("pname")
.value.trim();

const cat=document
.getElementById("pcat")
.value;

const price=document
.getElementById("pprice")
.value.trim();

const img=document
.getElementById("pimg")
.value.trim();

const link=document
.getElementById("plink")
.value.trim();

if(!num||num<1||num>100||!name){

alert("Isi nomor produk 1-100 dan nama produk.");

return;

}

const obj={
num:num,
name:name,
cat:cat,
price:price||"Harga belum tersedia",
img:img,
link:link||"#"
};

const index=products.findIndex(
p=>p.num===num
);

if(index>=0){

products[index]=obj;

}else{

products.push(obj);

}

localStorage.setItem(
KEY,
JSON.stringify(products)
);

clearForm();
render();

document.getElementById("status")
.textContent="✅ Produk berhasil disimpan.";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

function clearForm(){

document.getElementById("pnum").value="";
document.getElementById("pname").value="";
document.getElementById("pprice").value="";
document.getElementById("pimg").value="";
document.getElementById("plink").value="";

}

function resetProducts(){

if(!confirm(
"Yakin ingin menghapus semua produk?"
)) return;

products=[];

localStorage.removeItem(KEY);

render();

document.getElementById("status")
.textContent="Data produk sudah dihapus.";

}

document
.getElementById("search")
.addEventListener("input",render);

document
.getElementById("sort")
.addEventListener("change",render);

renderCats();
render();

</script>

</body>
</html>
